name: GitHub Actions Demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  init:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Исправлена опечатка (было node-varsion)
        node-version: [26.x]

    steps:
      # Обновлено с v3 до v4 для совместимости с Node 24+
      - uses: actions/checkout@v4

      - name: Starting Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install modules
        run: npm install

      - name: Build project
        run: npm run build

      - name: Test
        run: npm run test
